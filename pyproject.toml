[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimum-regret-matching"
version = "0.1.0"
description = "Small exact stable matching experiment"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",
    "redis>=8.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
